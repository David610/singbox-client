buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20")
    }
}

plugins {
    id("com.android.library")
    id("kotlin-android")
}

// Gradle only allows buildscript {}, pluginManagement {}, and other
// plugins {} blocks before a plugins {} block -- group/version
// assignments have to come after it, not before.
group = "app.singboxclient.vpn_core"
version = "0.1.0"

android {
    namespace = "app.singboxclient.vpn_core"
    compileSdk = 35

    defaultConfig {
        minSdk = 26
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    // The pinned sing-box/libbox core is NOT vendored as source in this
    // repository (it is Go, built by the upstream sing-box build system).
    // A developer produces libbox.aar locally by running
    // packages/vpn_core/native/singbox-go/build_android.sh (documented in
    // docs/BUILDING.md) and drops it here.
    //
    // Policy change from the prior milestone (see docs/ARCHITECTURE.md
    // "Why libbox.aar isn't committed" and its "Android VPN path"
    // section): libbox.aar is now a MANDATORY build input, checked below.
    // SingBoxVpnService.kt talks to `io.nekohasekai.libbox.*` via direct
    // imports, not reflection -- there is no code path left that could
    // silently "succeed" at connecting without a real core, so a missing
    // AAR must fail the Android build itself, loudly, rather than compile
    // a service that publishes CONNECTED without ever forwarding a
    // packet. `flutter pub get`/`flutter analyze`/`flutter test` at the
    // Dart level are unaffected -- they never invoke Gradle for this
    // module -- so this only gates an actual Android build/release.
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    def libboxAar = file("libs/libbox.aar")
    if (!libboxAar.exists()) {
        throw new GradleException(
            "packages/vpn_core/android/libs/libbox.aar is missing. " +
            "The Android VPN path links against the pinned sing-box core " +
            "directly (io.nekohasekai.libbox.*), not via reflection, so " +
            "this is a hard build failure by design -- see " +
            "docs/BUILDING.md 'Android VPN core' for how to produce it " +
            "(packages/vpn_core/native/singbox-go/build_android.sh)."
        )
    }
    // compileOnly, NOT implementation: the Android Gradle Plugin refuses
    // to bundle a *library* module (this one) into an AAR that has a
    // direct `files()`/local-.aar runtime dependency ("Direct local .aar
    // file dependencies are not supported when building an AAR" --
    // bundleDebugAar/bundleReleaseAar) because that dependency's
    // classes/resources wouldn't be packaged into the resulting AAR
    // anyway. So this only makes libbox.aar visible to *compile*
    // SingBoxVpnService.kt's `io.nekohasekai.libbox.*` imports here,
    // and the app module (android/app/build.gradle.kts, an application
    // module -- not subject to that restriction) declares the real
    // `implementation(files(...))` on the same .aar so its classes
    // actually land in the runtime classpath and the final APK.
    compileOnly(files(libboxAar))

    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
    androidTestImplementation("androidx.test:runner:1.6.2")
    // androidTest builds its own separate test APK (not an AAR), so the
    // "no direct local .aar dependency" restriction above doesn't apply
    // to it -- it needs the real classes at runtime to actually run
    // SingBoxVpnServiceInstrumentedTest.kt on a device/emulator.
    androidTestImplementation(files(libboxAar))
}
