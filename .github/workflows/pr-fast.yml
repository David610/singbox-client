name: PR fast checks

# The required, always-on merge gate: format, static analysis, and unit
# tests for both the app and packages/vpn_core. No native builds, no
# external network dependency beyond fetching the pinned Flutter SDK and
# pub/npm-style package metadata -- this is meant to return in minutes,
# every PR. See docs/CI.md "Fast PR gate vs. integration gate".
#
# All four steps below (format, app analyze, app test, vpn_core
# analyze/test) are real, blocking merge gates -- lib/app/utils/ and the
# VPNService/ProxyConfig/ServerConfig data models were reconstructed (see
# docs/ARCHITECTURE.md §9) and `flutter analyze`/`flutter test` on the
# root app pass cleanly as of this workflow revision. There is no
# continue-on-error left in this file: a check that can silently stay red
# forever is not a merge gate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # so .github/workflows/release.yml can gate a release on this job

concurrency:
  group: pr-fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to the latest patch of the earliest minor compatible with the
  # repo's Flutter (`>=3.44.2`) and Dart (`>=3.12.2`) constraints. See
  # docs/CI.md "Pinned versions".
  FLUTTER_VERSION: "3.44.9"

jobs:
  format-analyze-test:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/vpn_core/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: flutter pub get (app)
        run: flutter pub get

      - name: flutter pub get (vpn_core)
        working-directory: packages/vpn_core
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze (app)
        run: flutter analyze

      - name: flutter analyze (vpn_core)
        working-directory: packages/vpn_core
        run: flutter analyze

      - name: flutter test (app)
        run: flutter test --exclude-tags=interop

      - name: flutter test (vpn_core, unit + fixture tests)
        working-directory: packages/vpn_core
        run: flutter test --exclude-tags=interop

      - name: Summary
        if: always()
        run: |
          {
            echo "### Fast PR checks"
            echo ""
            echo "- App \`flutter analyze\`/\`flutter test\`: required, blocking."
            echo "- packages/vpn_core \`flutter analyze\`/\`flutter test\`: required, blocking."
          } >> "$GITHUB_STEP_SUMMARY"
