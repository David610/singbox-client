name: Android build

# Builds the pinned sing-box/libbox core from source, verifies it, then
# builds a debug APK (always signable, no secrets needed) and a
# release-configuration APK signed with a throwaway, freshly-generated,
# non-secret CI keystore (proves the shrunk/optimized release build graph
# actually compiles -- see docs/CI.md "Why a throwaway keystore, not
# --no-shrink"). No store/distribution signing secrets are used or
# required -- see docs/CI.md "Secrets required: NONE".
#
# The native-core build (steps up to and including "Verify libbox.aar
# contents") is the load-bearing part of this job: without it,
# android/build.gradle's hard `libbox.aar is missing` GradleException
# (packages/vpn_core/android/build.gradle) fails the build before Kotlin
# ever compiles against the real io.nekohasekai.libbox.* API, which is
# the actual thing this job exists to prove compiles.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # so .github/workflows/release.yml can gate a release on this job (debug-build smoke test, distinct from the real signed release build)

concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.9" # see docs/CI.md "Pinned versions"
  JAVA_VERSION: "17" # android/app/build.gradle.kts sourceCompatibility, and required by sing-box's own cmd/internal/build_libbox
  GO_VERSION: "1.24.7" # must match packages/vpn_core/native/singbox-go/go.mod's `go` directive
  NDK_VERSION: "28.2.13676358" # android/app/build.gradle.kts ndkVersion
  SING_BOX_PIN_TAG: "v1.13.19" # packages/vpn_core/UPSTREAM_VERSION.md
  SING_BOX_PIN_COMMIT: "b5ebaa1fc0f2b94256180b95468e73ef53caa27d"

jobs:
  android-build:
    name: Build Android (debug + release-config, unsigned-equivalent)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        # Installs cmdline-tools and accepts all standard SDK licenses.
        # compileSdk 35 / buildTools 36.0.0 (pinned in
        # android/app/build.gradle.kts, unchanged by this workflow) are
        # fetched by the Android Gradle Plugin's own auto-download during
        # the build below, now that licenses are pre-accepted. NDK is
        # installed explicitly below -- build_android.sh needs it
        # *before* Gradle ever runs, not lazily during the build.

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: sdkmanager --install "ndk;${{ env.NDK_VERSION }}"

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false # cache keyed manually below against the pinned commit

      - name: Verify the sing-box pin is consistent everywhere it's recorded
        run: packages/vpn_core/native/singbox-go/check_pin_consistency.sh

      - name: Cache Go build/module cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-singbox-android-${{ env.SING_BOX_PIN_COMMIT }}
          restore-keys: go-singbox-android-

      - name: Install gomobile/gobind (sagernet fork, pinned by sing-box's own Makefile)
        # `make lib_android`'s `lib_install` target -- see
        # packages/vpn_core/native/singbox-go/README.md "Producing the
        # real mobile binaries". This is SagerNet's own fork
        # (github.com/sagernet/gomobile), NOT golang.org/x/mobile -- only
        # the fork's `build_libbox`-driven bind matches what upstream's
        # `make lib_android` actually invokes.
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar from the pinned sing-box source
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: packages/vpn_core/native/singbox-go/build_android.sh

      - name: Verify libbox.aar was produced at the pinned commit
        run: |
          set -euo pipefail
          test -f packages/vpn_core/android/libs/libbox.aar
          echo "Built libbox.aar from sing-box ${{ env.SING_BOX_PIN_TAG }} / ${{ env.SING_BOX_PIN_COMMIT }}"
          ACTUAL_COMMIT="$(git -C packages/vpn_core/native/singbox-go/.sing-box-checkout rev-parse HEAD)"
          if [ "$ACTUAL_COMMIT" != "${{ env.SING_BOX_PIN_COMMIT }}" ]; then
            echo "::error::checked-out sing-box commit ($ACTUAL_COMMIT) does not match the pin (${{ env.SING_BOX_PIN_COMMIT }})"
            exit 1
          fi

      - name: Verify libbox.aar contents (sanity check)
        run: |
          set -euo pipefail
          echo "### libbox.aar contents (jni/*)"
          unzip -l packages/vpn_core/android/libs/libbox.aar | grep '\.so$'
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l packages/vpn_core/android/libs/libbox.aar | grep -q "jni/$abi/libbox.so" \
              || { echo "::error::libbox.aar is missing jni/$abi/libbox.so"; exit 1; }
          done
          unzip -p packages/vpn_core/android/libs/libbox.aar classes.jar > /tmp/libbox-classes.jar
          unzip -l /tmp/libbox-classes.jar | grep -q 'io/nekohasekai/libbox/PlatformInterface.class' \
            || { echo "::error::libbox.aar's classes.jar is missing io.nekohasekai.libbox.PlatformInterface"; exit 1; }

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'packages/vpn_core/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: flutter clean (clean dependency resolution)
        run: flutter clean

      - name: flutter pub get
        run: flutter pub get

      - name: Build debug APK (Kotlin compiles against the real io.nekohasekai.libbox API)
        run: flutter build apk --debug

      - name: Generate throwaway CI-only release keystore (NOT a secret)
        # A fresh, meaningless keystore generated on every run and never
        # persisted anywhere -- not a secret, not reused, not suitable
        # for distribution. Exists only so the *release* build type's
        # shrink/optimize/signing-config graph in
        # android/app/build.gradle.kts can actually execute in CI without
        # the repo's real (absent, private) production signing key. See
        # docs/CI.md "Why a throwaway keystore".
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci-release.keystore" \
            -storepass ci-throwaway-not-a-secret \
            -keypass ci-throwaway-not-a-secret \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI Build,OU=CI,O=CI,L=CI,S=CI,C=US"
          cat > android/key.properties <<EOF
          storePassword.debug=ci-throwaway-not-a-secret
          keyPassword.debug=ci-throwaway-not-a-secret
          keyAlias.debug=ci
          storeFile.debug=$RUNNER_TEMP/ci-release.keystore
          storePassword.release=ci-throwaway-not-a-secret
          keyPassword.release=ci-throwaway-not-a-secret
          keyAlias.release=ci
          storeFile.release=$RUNNER_TEMP/ci-release.keystore
          EOF

      - name: Build release-configuration APK (throwaway-signed)
        run: flutter build apk --release

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release-configuration APKs (throwaway-signed)
        # android/app/build.gradle.kts enables per-ABI splits plus a
        # universal APK, so this is a glob (app-armeabi-v7a-release.apk,
        # app-arm64-v8a-release.apk, app-universal-release.apk), not one
        # fixed filename.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-config-apks-THROWAWAY-SIGNED
          path: build/app/outputs/flutter-apk/*release*.apk
          if-no-files-found: warn
          retention-days: 14
